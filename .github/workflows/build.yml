name: Build and containment acceptance
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew --no-daemon clean check build
      - run: python3 scripts/acceptance.py --profile core --directory run-ci-core
      - name: Real client smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1
          python3 scripts/client-acceptance.py --source run-ci-core/world --civilis
      - name: Checksum validated build
        run: sha256sum build/libs/sporebound-0.8.0.jar | tee build/libs/sporebound-0.8.0.jar.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sporebound-0.8.0-validation
          path: |
            build/libs/*.jar
            build/libs/*.sha256
            build/reports/
            run-ci-core-*.log
            client-validation.log
            run-client/client-validation.json
            run-client/screenshots/

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sporebound-0.8.0-validation
          path: verified
      - name: Publish and verify Sporebound 0.8.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir release
          mapfile -t jars < <(find verified -type f -name 'sporebound-0.8.0.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" release/
          cp docs/RELEASE_0.8.0.md release/RELEASE_NOTES.md
          cd release
          unzip -p sporebound-0.8.0.jar META-INF/neoforge.mods.toml | grep -q 'version="0.8.0"'
          sha256sum sporebound-0.8.0.jar > sporebound-0.8.0.jar.sha256
          if gh release view v0.8.0 >/dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.8.0" --jq .object.sha)" = "$GITHUB_SHA"
          else
            gh release create v0.8.0 sporebound-0.8.0.jar sporebound-0.8.0.jar.sha256 --target "$GITHUB_SHA" --title 'Sporebound 0.8.0 — The Living Frontier' --notes-file RELEASE_NOTES.md --latest
          fi
          mkdir published
          gh release download v0.8.0 --pattern sporebound-0.8.0.jar --pattern sporebound-0.8.0.jar.sha256 --dir published
          cmp sporebound-0.8.0.jar published/sporebound-0.8.0.jar
          cmp sporebound-0.8.0.jar.sha256 published/sporebound-0.8.0.jar.sha256
          cd published
          sha256sum --check sporebound-0.8.0.jar.sha256
