name: Build and containment acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew --no-daemon clean check build
      - run: python3 scripts/acceptance.py --profile core --directory run-ci-core
      - name: Real client smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1
          python3 scripts/client-acceptance.py --source run-ci-core/world
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sporebound-development
          path: |
            build/libs/*.jar
            build/reports/
            run-ci-core-*.log
            client-validation.log
            run-client/client-validation.json
            run-client/screenshots/
